;
; The integer cputest corpus for the MC68040: WinUAE's cputestgen over the
; integer instruction set it knows for a 68040 (generate.sh's INT list, one
; instruction per run), with no FPU (cputest generates FPU tests only in a set
; of their own: cputestgen-fpu.ini) and no MMU instructions (cputest has none).
;
; The memory map is RD68031's (tools/cputest/cputestgen.ini there), which
; fits a 64 KB 32-bit port:
;   $0000-$7FFF  low memory, reachable by (xxx).W
;   $8000-$FFFF  test memory: the instructions, operands and both stacks
; RD68041 has no cputest bench yet (M7); the map is to be revisited then.
[cputest]
cpu=68040
cpu_address_space=68020
fpu=
verbose=0
path=data/
feature_gzip=0
max_file_size=0
test_low_memory_start=0x0000
test_low_memory_end=0x8000
test_memory_start=0x8000
test_memory_size=0x8000
test_rounds=1
min_opcode_test_rounds=0
feature_exception3_data=0
feature_exception3_instruction=0
feature_usp=0
; all zeros and all ones CCR (Xcc instructions still get all 32)
feature_flags_mode=1
; no extra T/S/M rounds; privileged instructions get their S=1 round anyway
feature_sr_mask=0x0000
; the generator's own masks for the flags PRM 4 leaves undefined (DIVx, CHK,
; CHK2); it emits them for 0 (RD68031 found the readme's 1 does not)
feature_undefined_ccr=0
feature_full_extension_format=0
; RD68031's seed: seed 1 sends the generator into an endless retry on OR.L
seed=2

[test=RD040]
enabled=1
mode=all
