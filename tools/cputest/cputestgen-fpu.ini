;
; The FPU cputest corpus for the MC68040: cputestgen with fpu=68040 over the
; FPU instructions it knows (generate.sh's FPU list, one per run). The
; instructions the MC68040 does not implement (UM table 9-10) are generated
; too: with fpu_unimplemented left at 0 the generator records them as the
; part takes them, vector 11 with a format $2 frame, and unsupported data
; types as vector 55. FSAVE and FRESTORE are not in cputest's FPU support.
;
; Same memory map as cputestgen.ini.
[cputest]
cpu=68040
cpu_address_space=68020
fpu=68040
verbose=0
path=data/
feature_gzip=0
max_file_size=0
test_low_memory_start=0x0000
test_low_memory_end=0x8000
test_memory_start=0x8000
test_memory_size=0x8000
test_rounds=1
min_opcode_test_rounds=0
feature_exception3_data=0
feature_exception3_instruction=0
feature_usp=0
; FPU: all zeros and all ones FPSR condition codes and FPCR rounding
; precision and mode (the generator's 2 x 16 loops)
feature_flags_mode=1
feature_sr_mask=0x0000
feature_undefined_ccr=0
feature_full_extension_format=0
seed=2

[test=RD040F]
enabled=1
mode=all
